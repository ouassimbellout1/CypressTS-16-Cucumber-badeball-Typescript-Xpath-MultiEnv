name: E2E tests

on:
  push:
  pull_request:

jobs:
  e2e:
    name: Run Cypress tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean Allure results
        run: npm run allure:clean

      - name: Run Cypress tests
        id: cypress
        continue-on-error: true
        run: npm run test:e2e:ci

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: error

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

  report:
    name: Generate Allure report
    needs: e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error

  quality-gate:
    name: Validate E2E result
    needs: e2e
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Fail workflow when tests fail
        if: needs.e2e.result == 'failure'
        run: exit 1

      - name: Confirm successful tests
        if: needs.e2e.result == 'success'
        run: echo "All E2E tests passed."
