name: E2E tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Cypress (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install --force

      - name: Resolve and smoke-test browser
        id: browser-choice
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.browser }}" in
            chrome)
              CANDIDATES=(google-chrome google-chrome-stable)
              ;;
            edge)
              CANDIDATES=(microsoft-edge microsoft-edge-stable)
              ;;
            *)
              echo "::error::Unsupported browser: ${{ matrix.browser }}"
              exit 1
              ;;
          esac

          BROWSER_PATH=""
          for candidate in "${CANDIDATES[@]}"; do
            if command -v "$candidate" >/dev/null 2>&1; then
              BROWSER_PATH="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$BROWSER_PATH" ]; then
            echo "::error::${{ matrix.browser }} is not installed on this GitHub-hosted runner."
            exit 1
          fi

          echo "Using browser executable: $BROWSER_PATH"
          if ! timeout 30s "$BROWSER_PATH" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --dump-dom about:blank > browser-smoke.html 2> browser-smoke.log; then
            cat browser-smoke.log
            echo "::error::${{ matrix.browser }} could not start in headless mode."
            exit 1
          fi

          if ! grep -qi "<html" browser-smoke.html; then
            cat browser-smoke.log
            echo "::error::${{ matrix.browser }} started but returned no HTML from the smoke test."
            exit 1
          fi

          echo "browser_path=$BROWSER_PATH" >> "$GITHUB_OUTPUT"

      - name: Run Cypress E2E suite
        run: node cypress/support/run-e2e-and-generate-reports.ts --browser "${{ steps.browser-choice.outputs.browser_path }}" --headless

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results
          if-no-files-found: warn

      - name: Upload Cypress screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.browser }}
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

      - name: Write failure summary for debugging
        if: failure()
        shell: bash
        run: |
          {
            echo "## Cypress failure summary"
            echo "- Browser: ${{ matrix.browser }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Runner: ${{ runner.os }}"
            echo "- Artifacts uploaded: allure-results-${{ matrix.browser }}, cypress-artifacts-${{ matrix.browser }}"
            echo ""
            echo "### Available diagnostics"
            if [ -d "cypress/screenshots" ]; then echo "- Screenshots directory present"; fi
            if [ -d "cypress/videos" ]; then echo "- Videos directory present"; fi
            if [ -f "allure-results/allure-e2e-report.json" ]; then echo "- Allure summary file present"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Generate Allure report
    needs: e2e
    if: always()
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Download Allure results from all matrix runs
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Check downloaded results
        shell: bash
        run: |
          if [ ! -d "allure-results" ] || [ -z "$(find allure-results -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
            echo "::warning::No Allure result files were downloaded from the matrix jobs. Skipping HTML generation."
            mkdir -p allure-report
            echo "No Allure results available for this run." > allure-report/NO_RESULTS.txt
          fi

      - name: Generate HTML report
        if: ${{ hashFiles('allure-results/**') != '' }}
        run: npm run allure:generate

      - name: Upload HTML report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn

      - name: Upload for GitHub Pages
        if: always() && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && hashFiles('allure-report/**') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report

      - name: Publish summary of report generation
        if: always()
        shell: bash
        run: |
          {
            echo "## Allure report status"
            echo "- Job: ${{ github.job }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Report artifact: allure-report"
            echo "- Pages deployment: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-report:
    name: Deploy GitHub Pages report
    needs: report
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deployment URL
        run: |
          echo "Allure report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    name: Quality gate
    needs: e2e
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Fail workflow if any matrix run failed
        if: contains(needs.e2e.result, 'failure')
        run: exit 1

      - name: Write final success summary
        if: needs.e2e.result == 'success'
        shell: bash
        run: |
          {
            echo "## ✅ E2E matrix passed"
            echo "- All Cypress browser variants completed successfully."
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- SHA: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
